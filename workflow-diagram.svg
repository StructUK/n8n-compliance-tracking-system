<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" font-family="DM Sans, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3DBF3D" />
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="380" fill="#08090A" />

  <text x="24" y="34" fill="#F0F2EF" font-size="20" font-weight="700" font-family="Syne, Arial, sans-serif">Compliance Tracking System</text>
  <text x="24" y="56" fill="#A9ADA8" font-size="12" letter-spacing="1">DAILY AT 08:00</text>

  <g font-size="13" fill="#F0F2EF">
    <rect x="24" y="76" width="140" height="60" rx="10" fill="#0F1010" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="94" y="102" text-anchor="middle">Schedule</text>
    <text x="94" y="120" text-anchor="middle" fill="#A9ADA8" font-size="11">Check Compliance</text>

    <line x1="164" y1="106" x2="202" y2="106" stroke="#3DBF3D" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="204" y="76" width="140" height="60" rx="10" fill="#0F1010" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="274" y="102" text-anchor="middle">Google Sheets</text>
    <text x="274" y="120" text-anchor="middle" fill="#A9ADA8" font-size="11">Read Properties</text>

    <line x1="344" y1="106" x2="382" y2="106" stroke="#3DBF3D" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="384" y="76" width="160" height="60" rx="10" fill="#0F1010" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="464" y="102" text-anchor="middle">Evaluate</text>
    <text x="464" y="120" text-anchor="middle" fill="#A9ADA8" font-size="11">60 / 30 / 7-day thresholds</text>

    <line x1="544" y1="96" x2="582" y2="60" stroke="#3DBF3D" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="544" y1="116" x2="582" y2="152" stroke="#3DBF3D" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="584" y="30" width="160" height="60" rx="10" fill="#0F1010" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="664" y="56" text-anchor="middle">Google Sheets</text>
    <text x="664" y="74" text-anchor="middle" fill="#A9ADA8" font-size="11">Update Statuses (always)</text>

    <rect x="584" y="122" width="140" height="60" rx="10" fill="#0F1010" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="654" y="148" text-anchor="middle">Extract Alerts</text>
    <text x="654" y="166" text-anchor="middle" fill="#A9ADA8" font-size="11">threshold crossed only</text>

    <line x1="724" y1="152" x2="762" y2="152" stroke="#3DBF3D" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="764" y="122" width="130" height="60" rx="10" fill="#0F1010" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="829" y="148" text-anchor="middle">Alert Config</text>
    <text x="829" y="166" text-anchor="middle" fill="#A9ADA8" font-size="11">owner + channel</text>

    <line x1="894" y1="142" x2="932" y2="106" stroke="#3DBF3D" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="894" y1="162" x2="932" y2="198" stroke="#3DBF3D" stroke-width="2" marker-end="url(#arrow)"/>

    <rect x="934" y="76" width="140" height="60" rx="10" fill="#0F1010" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="1004" y="102" text-anchor="middle">Email</text>
    <text x="1004" y="120" text-anchor="middle" fill="#A9ADA8" font-size="11">Notify Compliance Owner</text>

    <rect x="934" y="168" width="140" height="60" rx="10" fill="#0F1010" stroke="#2A9D2A" stroke-width="1.5"/>
    <text x="1004" y="194" text-anchor="middle">Slack</text>
    <text x="1004" y="212" text-anchor="middle" fill="#A9ADA8" font-size="11">Notify Compliance Owner</text>
  </g>

  <text x="24" y="330" fill="#A9ADA8" font-size="12">Each 60 / 30 / 7-day threshold fires once per certificate. Overdue status is recomputed and stays flagged every run.</text>
  <text x="24" y="360" fill="#A9ADA8" font-size="11">Struct Solutions — struct.solutions</text>
</svg>
